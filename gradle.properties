# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin rejects the kotlin.sourceSets DSL. KSP 2.3.6 is the real fix; this flag is the documented
# workaround for any plugin that still touches the old DSL. Temporary: AGP plans to deprecate this flag in 2026.
android.disallowKotlinSourceSets=false
